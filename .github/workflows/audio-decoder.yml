name: Build bundled WMA decoders

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/build_audio_decoder.sh'
      - '.github/workflows/audio-decoder.yml'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            shell: bash
          - os: macos-15-intel
            platform: macos
            shell: bash
          - os: windows-2022
            platform: windows
            shell: 'msys2 {0}'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Windows build tools
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            make tar xz curl gnupg
            mingw-w64-x86_64-gcc
      - name: Install macOS signature verifier
        if: runner.os == 'macOS'
        run: brew install gnupg
      - name: Verify source and build minimal decoder
        shell: ${{ matrix.shell }}
        run: |
          set -euo pipefail
          mkdir -p source output
          curl -fL https://ffmpeg.org/releases/ffmpeg-8.1.3.tar.xz -o source/ffmpeg-8.1.3.tar.xz
          curl -fL https://ffmpeg.org/releases/ffmpeg-8.1.3.tar.xz.asc -o source/ffmpeg-8.1.3.tar.xz.asc
          curl -fL https://ffmpeg.org/ffmpeg-devel.asc -o source/release-key.asc
          export GNUPGHOME="$(mktemp -d)"
          gpg --import source/release-key.asc
          gpg --status-fd 1 --verify source/ffmpeg-8.1.3.tar.xz.asc source/ffmpeg-8.1.3.tar.xz | tee source/signature.txt
          grep -q 'VALIDSIG FCF986EA15E6E293A5644F10B4322F04D67658D8' source/signature.txt
          bash tools/build_audio_decoder.sh source/ffmpeg-8.1.3.tar.xz '${{ matrix.platform }}' output
          cp source/signature.txt source/ffmpeg-8.1.3.tar.xz.asc output/
      - name: Decode production WMA fixture
        shell: ${{ matrix.shell }}
        run: |
          set -euo pipefail
          binary=output/ffmpeg
          if [[ '${{ matrix.platform }}' == windows ]]; then binary=output/ffmpeg.exe; fi
          "$binary" -hide_banner -loglevel error -y -i tests/fixtures/audio/tone.wma -vn -acodec pcm_s16le output/decoded.wav
          test -s output/decoded.wav
          "$binary" -hide_banner -i output/decoded.wav -f wav output/redecoded.wav
          test -s output/redecoded.wav
      - name: Upload decoder and corresponding source
        uses: actions/upload-artifact@v6
        with:
          name: wma-decoder-${{ matrix.platform }}
          path: output/
          if-no-files-found: error
