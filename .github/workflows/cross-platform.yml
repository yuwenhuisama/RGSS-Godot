name: Cross-platform RGSS verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  native-contracts:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            asset: linux_x86_64
            executable: Godot_v4.6.1-stable_mono_linux_x86_64/Godot_v4.6.1-stable_mono_linux.x86_64
          - os: macos-15
            asset: macos.universal
            executable: Godot_mono.app/Contents/MacOS/Godot
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - name: Install pinned Godot .NET editor
        shell: bash
        run: |
          set -euo pipefail
          archive="Godot_v4.6.1-stable_mono_${{ matrix.asset }}.zip"
          curl -fL "https://github.com/godotengine/godot-builds/releases/download/4.6.1-stable/$archive" -o "$archive"
          curl -fL https://github.com/godotengine/godot-builds/releases/download/4.6.1-stable/SHA512-SUMS.txt -o SHA512-SUMS.txt
          checksum=$(grep " $archive$" SHA512-SUMS.txt)
          test -n "$checksum"
          if [[ "$RUNNER_OS" == macOS ]]; then
            printf '%s\n' "$checksum" | shasum -a 512 -c -
          else
            printf '%s\n' "$checksum" | sha512sum -c -
          fi
          unzip -q "$archive" -d godot
          echo "GODOT_BIN=$PWD/godot/${{ matrix.executable }}" >> "$GITHUB_ENV"
          templates=Godot_v4.6.1-stable_mono_export_templates.tpz
          curl -fL "https://github.com/godotengine/godot-builds/releases/download/4.6.1-stable/$templates" -o "$templates"
          checksum=$(grep " $templates$" SHA512-SUMS.txt)
          test -n "$checksum"
          if [[ "$RUNNER_OS" == macOS ]]; then
            printf '%s\n' "$checksum" | shasum -a 512 -c -
            destination="$HOME/Library/Application Support/Godot/export_templates/4.6.1.stable.mono"
          else
            printf '%s\n' "$checksum" | sha512sum -c -
            destination="$HOME/.local/share/godot/export_templates/4.6.1.stable.mono"
          fi
          mkdir -p "$destination"
          unzip -q "$templates" -d export_templates
          cp export_templates/templates/* "$destination/"
      - name: Build managed runtime with bundled native libraries
        run: dotnet build RGSS-Godot.csproj
      - name: Reject machine-specific test paths
        run: python3 tools/check_test_paths.py
      - name: Run data-independent native and Ruby contracts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          # RPG database/game owners need separately installed licensed data.
          # CI checks these existing owners without fabricating those inputs.
          for entry in 'test_native_extensions:NATIVE_EXTENSIONS_PASS' 'test_zlib_stream:ZLIB_STREAM_PASS' 'test_defined_runtime:DEFINED_RUNTIME_PASS:77' 'test_rgss_api:RGSS_API_TESTS_PASS' 'test_marshal_io:MARSHAL_IO_PASS' 'test_kernel_file_lifecycle:KERNEL_FILE_LIFECYCLE_PASS'; do
            runner=${entry%%:*}
            marker=${entry#*:}
            "$GODOT_BIN" --headless --path . -s "tests/$runner.gd" 2>&1 | tee "evidence/$runner.log"
            grep -Fxq "$marker" "evidence/$runner.log"
            ! grep -q 'ERROR: FATAL:' "evidence/$runner.log"
            ! grep -q 'ERROR: Leaked unsafe reference' "evidence/$runner.log"
          done
      - name: Export actual Release package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p export
          if [[ "$RUNNER_OS" == macOS ]]; then
            cp tools/macos_export_presets.cfg export_presets.cfg
            "$GODOT_BIN" --headless --path . --export-release macOS export/RGSS-Godot.zip --quit-after 60 2>&1 | tee evidence/export.log
            test -s export/RGSS-Godot.zip
            unzip -q export/RGSS-Godot.zip -d export/install
          else
            cp tools/linux_export_presets.cfg export_presets.cfg
            "$GODOT_BIN" --headless --path . --export-release Linux export/RGSS-Godot.x86_64 --quit-after 60 2>&1 | tee evidence/export.log
            test -s export/RGSS-Godot.x86_64
            chmod 755 export/data_RGSS-Godot_linuxbsd_x86_64/Plugins/linux/audio/ffmpeg
          fi
      - name: Run installed native and bundled WMA probe
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == macOS ]]; then
            install="$PWD/export/install/RGSS-Godot.app/Contents/MacOS"
            executable="$install/RGSS-Godot"
            chmod 755 export/install/RGSS-Godot.app/Contents/Resources/data_RGSS-Godot_macos_arm64/Plugins/macos/audio/ffmpeg
          else
            install="$PWD/export"
            executable="$install/RGSS-Godot.x86_64"
          fi
          cp -R RGSS "$install/"
          cp tools/macos_release_probe.rb "$install/RGSS/main.rb"
          cp tests/fixtures/audio/tone.wma "$install/"
          printf '{"project_path":".","rtp_path":"","legacy_mode":true,"legacy_mode_width":544,"legacy_mode_height":416,"cn_ver_rmva":true}\n' > "$install/rm_conf.json"
          mkdir -p export/empty-cwd export/profile
          cd export/empty-cwd
          env -u DOTNET_ROOT -u MRUBY_DIR -u RGSS_FFMPEG_PATH HOME="$GITHUB_WORKSPACE/export/profile" "$executable" --headless --audio-driver Dummy --quit-after 60 2>&1 | tee "$GITHUB_WORKSPACE/evidence/package.log"
          grep -Fxq MACOS_RELEASE_NATIVE_WMA_PASS "$GITHUB_WORKSPACE/evidence/package.log"
          grep -Fxq MAIN_LOADED:OK "$GITHUB_WORKSPACE/evidence/package.log"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: native-contracts-${{ matrix.os }}
          path: evidence/
          if-no-files-found: error
